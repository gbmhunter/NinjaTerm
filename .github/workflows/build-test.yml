name: Build Test

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci
      
    - name: Rebuild native modules (fallback)
      run: npm rebuild --build-from-source=false
      continue-on-error: true

    - name: Run unit tests
      run: npm run test:unit

    - name: Run TypeScript check
      run: npx tsc --noEmit

    - name: Build Electron app
      run: npm run build

    - name: Test Electron app build (no packaging)
      run: npx electron-builder --dir
      env:
        # Skip notarization and signing in PR builds
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Run E2E tests (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: npm run test:electron:headless