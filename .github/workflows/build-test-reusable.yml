name: Build and Test (Reusable)

on:
  workflow_call:
    inputs:
      run-electron-tests:
        description: 'Whether to run Electron tests'
        required: false
        default: true
        type: boolean
      skip-build-test:
        description: 'Whether to skip the electron-builder test (--dir)'
        required: false
        default: false
        type: boolean

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:unit

    - name: Install Xvfb (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Build Electron app
      run: npm run build

    - name: Install Playwright browsers (Ubuntu only)
      if: matrix.os == 'ubuntu-latest' && inputs.run-electron-tests
      run: npx playwright install --with-deps

    - name: Run Electron tests (headless)
      if: matrix.os == 'ubuntu-latest' && inputs.run-electron-tests
      run: |
        export DISPLAY=:99
        # Start Xvfb in the background and wait for it to be ready
        Xvfb :99 -screen 0 1280x960x24 -ac &
        sleep 3
        npm run test:electron:ci

    - name: Test Electron app build (no packaging)
      if: ${{ !inputs.skip-build-test }}
      run: npx electron-builder --dir
      env:
        # Skip notarization and signing in test builds
        CSC_IDENTITY_AUTO_DISCOVERY: false