[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Proxy /app/* to the web app hosted on Netlify (keeps ninjaterm.mbedded.ninja URL)
[[redirects]]
  from = "/app/*"
  to = "https://ninjaterm-app.netlify.app/app/:splat"
  status = 200
  force = true

# Proxy /app to the web app (keeps ninjaterm.mbedded.ninja URL)
[[redirects]]
  from = "/app"
  to = "https://ninjaterm-app.netlify.app/app"
  status = 200
  force = true

# Handle client-side routing for Docusaurus
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
