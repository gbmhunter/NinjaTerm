[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# FIRST, handle the exact path /app
[[redirects]]
  from = "/app"
  to = "https://ninjaterm-app.netlify.app"
  status = 301
  force = true

# SECOND, handle any path that starts with /app/
[[redirects]]
  from = "/app/*"
  to = "https://ninjaterm-app.netlify.app/:splat"
  status = 301
  force = true

# Handle client-side routing for Docusaurus
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
