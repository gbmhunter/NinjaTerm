[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Redirect /app and /app/* to the web app (direct Netlify URL)
[[redirects]]
  from = "/app/*"
  to = "https://ninjaterm-app.netlify.app/:splat"
  status = 301
  force = true

# Handle client-side routing for Docusaurus
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
